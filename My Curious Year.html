<title>The Curious Year</title>

<style>
/* Layout: a sticker planner. Twelve doodled months across the top, a lime-gridded calendar sheet on the left with its legend underneath, today's page taped on the right, the shelf below. */
:root{
  --paper:#fcf3df;      /* warm cream */
  --page:#fffaf0;       /* the page that is taped on */
  --sheet:#fff8e6;      /* the calendar sheet */
  --ink:#2f2618;        /* brown-black ink */
  --soft:#7b6a50;       /* pencil */
  --faint:#e8d9b4;      /* ruled lines */
  --dots:#efe0bb;       /* dot grid */
  --scrim:#2f261855;
  --grid:#c7d433;       /* lime grid lines */
  --orange:#f0961e;     /* hand-lettered title */
  --num:#d99a2b;        /* tiny date numerals */
  --wk:#e3a63e;         /* weekday labels */
  --t-done:#cfe8dc;     /* mint: done day */
  --t-slow:#fddfb5;     /* peach: slow day */
  --pill-ink:#3a2e1d;
  --p0:#fde98a;--p1:#fbb9bb;--p2:#86d9a8;--p3:#abc0f6;--p4:#cfb7f7;--p5:#fdcb90;--p6:#bfe4de;
  --mark:#c0708e;      /* month accent, set per month in JS */
  --hl:color-mix(in srgb,var(--mark) 30%,transparent);
  --mark-ink:color-mix(in srgb,var(--mark) 55%,var(--ink));
  --f-hand:"Gaegu","Shantell Sans","Comic Sans MS",ui-rounded,sans-serif;
  --f-display:"Shantell Sans","Comic Sans MS",ui-rounded,"Trebuchet MS",sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1c1812;--page:#26211a;--sheet:#221d16;--ink:#f4ead6;--soft:#b9a98c;--faint:#4a3f2d;--dots:#2a241b;--scrim:#000000aa;
  --grid:#8a9420;--orange:#f5a640;--num:#d2a14c;--wk:#c99a48;--t-done:#27493f;--t-slow:#54401f;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1c1812;--page:#26211a;--sheet:#221d16;--ink:#f4ead6;--soft:#b9a98c;--faint:#4a3f2d;--dots:#2a241b;--scrim:#000000aa;
  --grid:#8a9420;--orange:#f5a640;--num:#d2a14c;--wk:#c99a48;--t-done:#27493f;--t-slow:#54401f;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(var(--dots) 1.1px,transparent 1.3px);background-size:24px 24px;
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px 32px;flex-wrap:wrap}
.top>div{min-width:0}
.top h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.greet{color:var(--soft);font-size:14px;margin-top:2px}
.why{font-family:var(--f-display);font-size:14px;color:var(--mark-ink);margin-top:6px;max-width:52ch}
.linkish{background:none;border:0;padding:0;border-bottom:1.5px dashed var(--faint);color:var(--soft)}
.linkish:hover{color:var(--ink);border-color:var(--ink)}
.tools{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.find{border:0;border-bottom:1.5px dashed var(--faint);background:transparent;padding:4px 2px;width:150px;font-size:14px;border-radius:0}
.find:focus{outline:none;border-color:var(--ink)}

/* the year */
.year{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin:30px 0 40px}
.mo{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;border:0;background:transparent;border-radius:16px 10px 15px 11px;color:var(--soft);font-size:12px}

.mo.on{background:color-mix(in srgb,var(--c) 24%,transparent);color:var(--ink);font-weight:600}
.mo.on svg{opacity:1}
svg.d{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* month head */
.mh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 24px;align-items:start}
.mh .big{width:92px;height:92px;color:var(--mark);transform:rotate(-6deg);margin-top:8px}
.month{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,8vw,84px);line-height:1;letter-spacing:-.03em}
.subject{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2.5vw,26px);line-height:1.5;margin-top:0;text-wrap:balance}

.focus{color:var(--soft);max-width:58ch;margin-top:6px}
.weeks{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:14px;font-size:13px;color:var(--soft)}
.weeks b{font-family:var(--f-display);font-weight:600;color:var(--mark-ink);margin-right:5px}
.tally{font-family:var(--f-display);font-size:14px;margin-top:14px;color:var(--soft)}

/* spread */
.spread{display:grid;grid-template-columns:minmax(0,1fr);gap:48px;margin-top:32px;align-items:start}

.sheetcal{container-type:inline-size;background:var(--sheet);border:2px solid var(--grid);border-radius:20px;padding:18px 18px 16px;min-width:0}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mtitle{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--f-hand);font-weight:700;font-size:clamp(30px,4.2vw,48px);line-height:1;color:var(--orange);letter-spacing:.02em;text-transform:uppercase;text-align:center;white-space:nowrap}

.ann span{display:none}
.ann:hover span{text-decoration:underline wavy;text-underline-offset:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:2px solid var(--grid);border-left:2px solid var(--grid)}
.cal>*{border:0;border-right:2px solid var(--grid);border-bottom:2px solid var(--grid);min-width:0}
.wk{padding:7px 2px;text-align:center;font-family:var(--f-hand);font-style:italic;font-size:14px;color:var(--wk);text-transform:uppercase;letter-spacing:.06em}
.wk .wf{display:none}
@container (min-width:800px){.wk .wf{display:inline}.wk .ws{display:none}.ann span{display:inline}}
.oth{padding:7px 9px;font-family:var(--f-hand);font-style:italic;font-size:14px;color:var(--num);opacity:.5;min-height:108px}
.day{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-height:108px;padding:7px 8px 28px;text-align:left;background:transparent;border-radius:0;color:var(--ink)}
.day:hover{background:color-mix(in srgb,var(--grid) 16%,transparent)}
.day.done{background:var(--t-done)}
.day.slow{background:var(--t-slow)}
.day.sel{box-shadow:inset 0 0 0 3px var(--orange)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;width:100%}
.day .n{font-family:var(--f-hand);font-style:italic;font-size:15px;line-height:1;color:var(--num);font-variant-numeric:tabular-nums}
.day.today .n{color:var(--orange);font-weight:700}
.st{width:20px;height:20px;flex:none}
.day .pill{font-size:11px;padding:3px 8px;letter-spacing:.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .t{font-size:11px;line-height:1.3;color:var(--soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.day .stk{position:absolute;left:8px;bottom:7px;width:20px;height:20px}

.day.pop .st{animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.3)}60%{transform:scale(1.3)}to{transform:scale(1)}}
.legend{display:flex;flex-wrap:wrap;gap:16px 38px;margin-top:20px;min-width:0}
.legend>div{min-width:0}
.legend h4{font-family:var(--f-hand);font-weight:700;font-size:16px;color:var(--orange);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.legend ul{display:grid;gap:6px}

.key{margin-top:16px;font-size:12px;color:var(--soft)}

.when{font-size:13px;color:var(--soft)}
.topic{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.18;letter-spacing:-.01em;margin-top:4px;text-wrap:balance}

.pill{display:inline-block;font-family:var(--f-hand);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--pill-ink);background:var(--pc,var(--p0));border-radius:99px;padding:2px 13px;line-height:1.35}

.flow time{font-size:12px;color:var(--soft);padding-top:2px;font-variant-numeric:tabular-nums}
.flow strong{display:block;font-weight:600;font-size:14px}
.flow span{display:block;font-size:13px;color:var(--soft);line-height:1.45}
.fld{display:block;font-family:var(--f-display);font-weight:600;font-size:13px;margin:22px 0 4px;color:var(--mark-ink)}
.line{width:100%;border:0;border-bottom:1.5px dashed var(--faint);background:transparent;padding:8px 2px;font-size:16px;border-radius:0}
.line:focus{outline:none;border-color:var(--ink)}
.ruled{width:100%;min-height:112px;border:0;background-color:transparent;padding:0 2px;font-size:16px;line-height:28px;resize:vertical;
  background-image:repeating-linear-gradient(transparent 0 27px,var(--faint) 27px 28px);background-attachment:local;border-radius:0}
.ruled:focus{outline:none}
.feel{display:flex;gap:8px;flex-wrap:wrap}
.feel button{font-family:var(--f-display);font-size:13px;background:none;border:1.5px dashed var(--faint);border-radius:99px;padding:5px 15px;color:var(--soft)}
.feel button.on{background:var(--hl);border:1.5px solid var(--mark);color:var(--ink)}
.donebtn{display:block;width:100%;margin-top:26px;padding:14px;border:2px solid var(--ink);border-radius:15px 10px 16px 11px;background:transparent;font-family:var(--f-display);font-weight:600;font-size:16px}
.donebtn:hover{background:var(--hl)}
.donebtn[aria-pressed="true"]{background:color-mix(in srgb,var(--mark) 40%,var(--page));border-color:var(--mark-ink)}
.lines li{font-size:14px;padding:3px 0}
.lines b{font-family:var(--f-display);font-weight:600;font-size:12px;color:var(--mark-ink);margin-right:8px}
.quiet{color:var(--soft);font-size:13px}

.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:44px 48px;margin-top:72px}
.shelf>section{min-width:0}
.shelf h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin-bottom:12px}
.shelf .book{margin-bottom:14px}
.shelf .book b{font-family:var(--f-display);font-weight:600;font-size:15px;display:block;line-height:1.35}
.shelf .book small{display:block;color:var(--soft);font-size:13px}
.shelf .book p{font-size:13px;color:var(--soft);margin-top:2px}
.shelf a{color:var(--ink);text-decoration:underline dotted;text-underline-offset:4px;text-decoration-color:var(--mark)}
.shelf a:hover{background:var(--hl)}
.links{display:grid;gap:7px}
.proj p{margin-bottom:14px;max-width:46ch}
.tick{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--f-display);font-weight:600;font-size:14px;text-align:left}
.tick i{width:22px;height:22px;border:2px solid var(--ink);border-radius:7px 5px 8px 5px;display:grid;place-items:center;flex:none}

.tick[aria-pressed="true"] i::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.foot{margin-top:72px;font-family:var(--f-display);font-size:14px;color:var(--soft)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:var(--scrim)}

  padding:calc(26px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 24px}

.drawer h3{font-family:var(--f-display);font-weight:700;font-size:16px;margin:26px 0 0;color:var(--mark-ink)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.copybox{width:100%;margin-top:12px;min-height:140px;font-size:13px;border:1.5px dashed var(--faint);background:transparent;border-radius:8px;padding:8px}

  .mtitle{white-space:normal}
  .mtitle svg{display:none}
  .legend{gap:14px 24px}
  .page{padding:32px 18px 22px}
  .find{width:120px}
}
.flag{width:11px;height:11px;margin-left:5px;fill:var(--orange);vertical-align:-1px}
.fun{display:flex;align-items:center;gap:6px;margin-top:2px;font-family:var(--f-hand);font-weight:700;font-size:16px;color:var(--orange)}
.fun .flag{margin:0}
.stkr{filter:drop-shadow(1.2px 0 0 #fff) drop-shadow(-1.2px 0 0 #fff) drop-shadow(0 1.2px 0 #fff) drop-shadow(0 -1.2px 0 #fff) drop-shadow(0 1px 1.5px #0003)}
.day .stk2{position:absolute;right:6px;bottom:5px;width:28px;height:28px;transform:rotate(var(--r,0deg));transition:transform .18s}
.day:hover .stk2{transform:rotate(calc(var(--r,0deg) + 9deg)) scale(1.12)}
.stk2 svg{width:100%;height:100%;display:block}
.sheetcal{position:relative}
.stamp{position:absolute;top:-13px;right:24px;transform:rotate(7deg);font-family:var(--f-hand);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.06em;color:#1f9d55;border:3px double #1f9d55;border-radius:10px;padding:1px 12px;background:var(--sheet);z-index:2}
.mtitle svg{animation:tw 3.4s ease-in-out infinite}

.legend .lg{width:28px;height:28px}

.legend .hint{font-size:12px;text-transform:none;letter-spacing:0;font-family:var(--f-body);margin-top:6px}
.tray{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}

.tray button[aria-pressed="true"]{background:var(--hl);border-color:var(--mark)}
.fact{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:10px 12px;border:1.5px dashed var(--orange);border-radius:12px 10px 14px 9px;font-size:13px;line-height:1.45;background:color-mix(in srgb,var(--orange) 8%,transparent)}
.fact .owl{width:32px;height:32px;flex:none}
.fact b{font-family:var(--f-hand);color:var(--orange);text-transform:uppercase;letter-spacing:.05em;font-size:15px;margin-right:4px}

.pip[hidden]{display:none}

@keyframes drop{from{transform:translate(-50%,-150%)}to{transform:translate(-50%,0)}}

.owlw .owl{width:100%;height:100%;display:block}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}

.pip b{font-family:var(--f-hand);font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.06em;font-size:17px;line-height:1.1}

<div class="wrap">

<script>
const DATA=[{"subject":"World History and Archaeology","focus":"Read the past through evidence, places, and people.","weeks":["How we know the past","Early humans and first settlements","Ancient interconnected worlds","Empires, faiths, and exchange","Medieval to modern turning points"],"topics":["Primary vs secondary sources","Archaeology: layers, objects, and context","Dating the past and historical uncertainty","Human origins and migration","Hunter-gatherer lifeways","Agriculture and settled communities","Early cities and social organization","Mesopotamia and writing","Ancient Egypt and the Nile","Indus Valley cities","Early China and dynastic rule","Ancient African kingdoms and networks","Persian and Greek worlds","Rome and its legacies","South Asian empires and ideas","Nepal and the Himalaya: from Licchavi to unification","Silk Roads and Indian Ocean trade","The Americas before European conquest","The Mongol era and Eurasian exchange","Renaissance, printing, and knowledge","Colonialism and resistance","Revolutions and industrialization","Historical memory and whose stories survive"],"books":[["The Human Web","J. R. and William H. McNeill","Big-picture world history companion."],["A Little History of the World","E. H. Gombrich","Readable overview; pair with other regional perspectives."],["The Epic of Gilgamesh","Anonymous","Seek a library copy or legal public-domain translation."]],"resources":[["World History Encyclopedia","https://www.worldhistory.org/"],["Khan Academy World History","https://www.khanacademy.org/humanities/world-history"],["The Met Timeline","https://www.metmuseum.org/toah/"],["UNESCO World Heritage","https://whc.unesco.org/"]],"project":"Create an annotated world-history timeline with ten turning points, evidence, and connections between regions.","facts":["The word “primary” doesn’t mean “true”. A soldier’s diary is a primary source, and it can still be wrong, biased, or missing half the story.","Archaeologists dig in layers because deeper usually means older, an idea called stratigraphy. Digging destroys the layers, so the notes and photos become the real record.","Radiocarbon dating measures carbon-14 left in once-living things like wood or bone. It reaches back about 50,000 years, and every result comes with a plus-or-minus range.","Homo sapiens fossils from Jebel Irhoud in Morocco are about 300,000 years old, among the oldest known for our species.","Hunter-gatherers lived in small, mobile groups and knew hundreds of plants and animals by heart. For most of human history, this was the only way of life.","Wheat, barley, and peas were among the first crops farmed in the Fertile Crescent, more than 10,000 years ago.","Uruk in Mesopotamia held tens of thousands of people by around 3000 BCE, which makes it one of the first true cities.","Cuneiform means “wedge-shaped”. Scribes pressed a reed stylus into wet clay, and many early tablets were records of grain and beer, not poems.","The Nile flooded every year and left behind dark, fertile silt. Egyptians called their land Kemet, the “black land”, after that soil.","Cities like Mohenjo-daro had planned streets, brick houses, and covered drains. The Indus script is still undeciphered.","The Shang dynasty wrote questions on oracle bones, then heated them until they cracked. The cracks were read as answers, and the inscriptions are among China’s earliest writing.","Sudan has more pyramids than Egypt. The Kushite kings who built them even ruled Egypt for nearly a century as its 25th dynasty.","The Persian Empire built the Royal Road, roughly 2,700 km long, with relay stations along the way so messengers could cross huge distances quickly.","Roman concrete used volcanic ash, and the Pantheon’s concrete dome has stood for nearly 2,000 years.","Ashoka’s edicts were carved on rocks and pillars across South Asia. Scholars could only read the Brahmi script after it was deciphered in the 1830s.","The Changu Narayan pillar inscription, dated 464 CE under King Manadeva, is the oldest dated inscription found in Nepal.","The name “Silk Road” was coined in 1877 by German geographer Ferdinand von Richthofen. The routes carried paper, spices, ideas, and diseases too, not just silk.","The Inca ran a huge empire without a writing system like ours. They kept records with knotted cords called khipu.","The Mongol Empire ran a postal relay called the yam, with stations that supplied fresh horses and riders over enormous distances.","The oldest dated printed book is the Diamond Sutra from China, 868 CE, about 580 years before Gutenberg’s press.","Nepal was never colonised by a European power, though it lost land after the Anglo-Nepalese War of 1814 to 1816 and the Treaty of Sugauli.","In 1800s British mills, machines made cloth far faster than hand weaving, but workers, including children, often laboured very long hours. Factory laws arrived slowly.","Most people in history never got a statue, a biography, or a tomb. Historians hunt through tax records and court cases to hear them."]},{"subject":"Psychology and Human Behavior","focus":"Understand minds, emotions, and behavior through scientific evidence.","weeks":["Psychology as a science","Brain, sensation, and memory","Learning, emotion, and motivation","Personality and social behavior"],"topics":["What psychologists study","Research questions and hypotheses","Correlation vs causation","Experiments, samples, and ethics","Replication and limits of studies","Neurons and brain systems","Sensation and perception","Attention and cognitive load","How memory works","Forgetting and memory errors","Study skills that work: spacing and self-testing","Classical and operant conditioning","Emotion and regulation","Sleep, stress, and wellbeing","Motivation, goals, and habits","Personality theories and their limits","Development across the lifespan","Attachment and relationships","Groups, conformity, and authority","Bias, stereotypes, and attribution"],"books":[["Psychology 2e","OpenStax","Free online textbook; excellent foundation."],["The Man Who Mistook His Wife for a Hat","Oliver Sacks","Case stories; remember one case cannot prove a general rule."],["Thinking, Fast and Slow","Daniel Kahneman","Optional deeper reading; take it slowly."]],"resources":[["OpenStax Psychology","https://openstax.org/details/books/psychology-2e"],["Noba Project","https://nobaproject.com/"],["Crash Course Psychology","https://www.youtube.com/@crashcourse"]],"project":"Create an evidence-based explainer of one behavior using three concepts and a note about limitations.","facts":["Wilhelm Wundt opened what is often called the first psychology lab, in Leipzig in 1879.","A good hypothesis can be proven wrong. “People are complicated” can’t be tested, but “sleep-deprived students recall fewer words” can.","Ice cream sales and drownings both rise in summer. Hot weather explains both, so the ice cream isn’t causing anything.","The Belmont Report of 1979 set out respect for people, doing good, and fairness as core rules for human research in the US.","In 2015, the Open Science Collaboration tried to repeat 100 psychology studies. Fewer than half gave the same result, which sparked a push for open methods.","Your brain has roughly 86 billion neurons, and signals travel along some of them at over 100 metres per second.","Everyone has a blind spot where the optic nerve leaves the eye. Your brain quietly fills it in so you never notice.","In the “invisible gorilla” experiment, about half the viewers counting basketball passes missed a person in a gorilla suit walking through.","Working memory holds only a few chunks at once. Grouping digits in a phone number is a small trick that works with it.","Hermann Ebbinghaus charted the “forgetting curve” in the 1880s by memorising nonsense syllables. Most forgetting happens soon after learning.","Testing yourself usually beats re-reading, and spreading practice over days beats cramming. Both feel harder and work better.","Pavlov was studying digestion in dogs when he noticed they drooled before food arrived. That led to his work on conditioned reflexes.","Naming a feeling, like “I’m anxious”, can help calm it. Researchers call this affect labelling.","Teenagers’ and young adults’ body clocks naturally run later, so late nights aren’t only laziness. Adults generally need seven or more hours of sleep.","Deciding when and where you’ll do a habit makes you more likely to follow through. Researchers call these implementation intentions.","The Big Five traits (openness, conscientiousness, extraversion, agreeableness, neuroticism) have stronger research support than popular four-letter type tests.","Jean Piaget watched his own children closely to build his stages of development. Later studies found babies know more than he thought.","Harry Harlow’s monkeys preferred a soft cloth “mother” over a wire one that held milk, which showed that comfort matters as much as food.","In Solomon Asch’s line experiments, about three quarters of people went along with an obviously wrong group answer at least once.","The fundamental attribution error is blaming someone’s character for what a situation caused. When you’re late it’s traffic, when they’re late it’s laziness."]},{"subject":"World Literature and Storytelling","focus":"Explore stories as windows into people, history, and culture.","weeks":["How stories work","Myths, epics, and oral storytelling","Novels, drama, and poetry","Literature and society"],"topics":["Plot, conflict, and stakes","Narrator and point of view","Character wants and contradictions","Setting as a force","Theme vs topic","Epic structure and oral tradition","Hero journeys across cultures","Trickster tales and fables","Folktales from South Asia","Nepali voices: Devkota, Parijat, and the modern Nepali novel","Translation and cultural context","Novel structure and pacing","Drama and stage directions","Poetic imagery and sound","Metaphor, rhythm, and form","Class, gender, and power in fiction","Colonial and postcolonial voices","Coming-of-age stories","Dystopia and imagined futures"],"books":[["The Little Prince","Antoine de Saint-Exupéry","A short, thoughtful starting point."],["Blue Mimosa","Parijat","A Nepali classic in English; look for a library or bookshop copy."],["Selected stories","Rabindranath Tagore","Choose a reputable translation or library edition."]],"resources":[["Project Gutenberg","https://www.gutenberg.org/"],["Standard Ebooks","https://standardebooks.org/"],["Poetry Foundation","https://www.poetryfoundation.org/"],["Internet Archive","https://archive.org/"]],"project":"Write a short story with an author’s note about its theme, influences, and narrative choices.","facts":["Aristotle wrote about plot over 2,300 years ago and said a story needs a beginning, a middle, and an end.","A first-person narrator only knows what they know. Wide Sargasso Sea (1966) retells Jane Eyre from another character’s view, and it feels like a different book.","E. M. Forster called characters “round” if they can surprise you in a convincing way, and “flat” if they can’t.","In Wuthering Heights the wild Yorkshire moors shape the mood as much as any character does.","A topic is a word like “war”. A theme is a claim about it, like “war makes heroes of no one”.","The Epic of Gilgamesh is among the oldest known stories. It comes from Mesopotamia and was written on clay tablets nearly 4,000 years ago.","Joseph Campbell described a “monomyth”, or hero’s journey, in 1949. Critics say not every culture’s stories fit the pattern.","Anansi the spider, Coyote, and Loki are all tricksters from different cultures. They bend rules and win by wit instead of strength.","The Panchatantra, an ancient collection of Sanskrit animal fables, was translated into many languages and travelled as far as Europe.","Parijat’s novel Shirishko Phool (“Blue Mimosa”) won the Madan Puraskar, one of Nepal’s top literary prizes. Laxmi Prasad Devkota’s Muna Madan is another beloved classic.","The Italian saying “traduttore, traditore” means “translator, traitor”. Every translation involves choices, and something always shifts.","Many Victorian novels, including Dickens’s, first appeared in weekly or monthly instalments, so chapters were built to end on cliffhangers.","Shakespeare’s stage directions are famously short. “Exit, pursued by a bear” from The Winter’s Tale is one of the most famous.","A haiku is traditionally three short lines of 5, 7, and 5 sounds, and usually hints at a season.","George Lakoff and Mark Johnson argued in 1980 that we think in metaphors like “time is money” even in ordinary speech.","Jane Austen’s novels pay close attention to money and marriage. Women often couldn’t inherit property, which is why who marries whom matters so much.","Chinua Achebe’s Things Fall Apart (1958) is among the most widely read African novels, and tells the story of colonisation from inside an Igbo village.","The German word Bildungsroman names a story of a young person’s growth, like Jane Eyre or David Copperfield.","Yevgeny Zamyatin’s novel We, written around 1920, influenced George Orwell’s 1984."]},{"subject":"Philosophy, Ethics and Critical Thinking","focus":"Ask better questions, reason carefully, and examine assumptions.","weeks":["Logic and arguments","Knowledge and reality","Ethics and the good life","Freedom, society, and meaning"],"topics":["Claims, reasons, and conclusions","Deductive vs inductive reasoning","Common reasoning fallacies","Argument mapping","What can we know?","Skepticism and evidence","Mind and body","Consequences and utilitarian reasoning","Duty, rules, and rights","Virtue ethics and character","Buddhist and Indian logic: Nagarjuna, Nyaya, Charvaka","Care ethics and relationships","Justice and fairness","Free will and responsibility","Freedom and its limits","Existentialism and meaning"],"books":[["The Philosophy Book","DK","Visual overview; follow up with original texts."],["Apology","Plato","Public-domain translations are available."],["The Pig That Wants to Be Eaten","Julian Baggini","Optional thought experiments; library copy."]],"resources":[["Stanford Encyclopedia of Philosophy","https://plato.stanford.edu/"],["Internet Encyclopedia of Philosophy","https://iep.utm.edu/"],["OpenLearn","https://www.open.edu/openlearn/"],["Wireless Philosophy","https://www.wi-phi.com/"]],"project":"Write a reasoned ethical essay with a fair counterargument and your response.","facts":["In logic, an argument is just reasons plus a conclusion. It doesn’t have to be an angry quarrel.","“Every swan I’ve seen is white” is a classic inductive guess. Then black swans turned up in Australia.","“Ad hominem” means “to the person”: attacking who says something instead of what they say.","Drawing an argument as boxes and arrows shows which reasons actually hold up the conclusion, and makes gaps easy to spot.","Plato described knowledge as “justified true belief”. In 1963 Edmund Gettier published a short paper with counterexamples that still trouble that definition.","Descartes tried doubting everything he could, and ended up with “I think, therefore I am”.","Descartes thought mind and body were different kinds of thing. Philosophers still argue about how they connect.","Jeremy Bentham’s preserved body, dressed in his own clothes, is kept at University College London.","Kant’s “categorical imperative” asks whether you could want everyone to follow your rule. “Lie when it’s convenient” fails that test.","Aristotle said virtues are habits. You become brave by doing brave things, a bit like learning an instrument.","Nagarjuna, who lived around the 2nd century CE, founded Madhyamaka philosophy. The Charvaka school was an early skeptical, materialist tradition in India.","Care ethics, developed by thinkers like Carol Gilligan and Nel Noddings, starts from relationships and responsibility instead of abstract rules.","John Rawls’ “veil of ignorance” asks you to design a society without knowing whether you’d be rich or poor, or where you’d be born.","In Benjamin Libet’s experiments in the 1980s, brain activity appeared before people said they decided to move. What that means is still debated.","John Stuart Mill’s “harm principle” says power can rightly be used against someone only to prevent harm to others.","Sartre said “existence precedes essence”: you aren’t born with a fixed purpose, you make one through your choices."]},{"subject":"Mythology, Religions and Worldviews","focus":"Explore sacred stories, rituals, symbols, and worldviews with respect.","weeks":["What myths and religions do","South Asian traditions","Religions across regions","Mythic worlds and modern life"],"topics":["Myth, legend, scripture, and history","Oral traditions and sacred narratives","Rituals, symbols, and sacred spaces","How scholars study belief","Hindu traditions: diversity and history","Buddhist traditions and the life of the Buddha","Lumbini and the Kathmandu Valley: shared sacred places","Jain ideas and nonviolence","Sikh history and practices","Bhakti and Sufi traditions","Judaism: history and traditions","Christianity: origins and diversity","Islam: origins and diverse practices","Confucianism and Daoism","Indigenous traditions and living communities","Greek and Roman myth cycles","Egyptian and Norse myth: two views of the cosmos","Myth in modern books and cinema"],"books":[["Mythos","Stephen Fry","Accessible Greek myth retellings; compare with ancient sources."],["The Bhagavad Gita","Various translators","Choose a reputable translation and read in context."],["The World’s Religions","Huston Smith","Optional comparative library reading."]],"resources":[["BBC Religions","https://www.bbc.co.uk/religion/religions/"],["Smarthistory","https://smarthistory.org/"],["The British Museum","https://www.britishmuseum.org/"],["The Met Collection","https://www.metmuseum.org/art/collection"]],"project":"Create a respectful comparative guide to selected myths or traditions, noting context and diversity.","facts":["In everyday speech “myth” means false, but scholars use it for stories a community tells to explain its world.","Oral traditions kept stories steady for centuries through rhythm, repetition, and rehearsal. The Vedas were passed on by memory long before they were written down.","Many sacred spaces share one idea: you step from ordinary space into special space, often by removing shoes or washing your hands.","Religious studies tries to describe beliefs fairly without ruling on whether they are true.","“Hinduism” covers many traditions and texts, with no single founder or central book. The word comes from “Sindhu”, the Indus river.","The Buddha was born as Siddhartha Gautama in Lumbini, in present-day Nepal, as an Ashokan pillar inscription records.","The Kathmandu Valley has seven World Heritage monument zones, and Lumbini is a separate World Heritage site.","Some Jain monks and nuns sweep the path ahead of them to avoid harming tiny insects, following the principle of ahimsa, or non-harm.","Sikh gurdwaras run a langar, a free community kitchen where anyone can sit and eat together.","Bhakti poets like Kabir and Mirabai sang in everyday languages, so devotion was open to people who didn’t know Sanskrit.","The Hebrew calendar is lunisolar, and Shabbat begins at sunset on Friday.","Christianity began in the 1st century CE and today includes many traditions, among them Orthodox, Catholic, and Protestant churches.","The Islamic calendar is lunar, so Ramadan moves about ten or eleven days earlier each year.","The Dao De Jing is only about 5,000 characters long, yet it’s one of the most translated books in the world.","Many Indigenous traditions tie sacred stories to specific places. A mountain, a river, or a valley is part of the story itself.","The Romans adopted many Greek gods under new names: Zeus became Jupiter, and Aphrodite became Venus.","Norse myth ends with Ragnarök, a great final battle, after which the world is reborn. Egyptians pictured the dead having their hearts weighed against a feather.","J. R. R. Tolkien, a scholar of Old English, drew on Norse and Old English myth when writing The Lord of the Rings."]},{"subject":"Science, Mathematics and the Universe","focus":"Build scientific literacy from everyday evidence to cosmic scale.","weeks":["Scientific thinking and mathematics","Physics and chemistry","Life and evolution","Earth, space, and climate"],"topics":["Observation, models, and testable claims","Measurement, units, and estimation","Ratios, percentages, and graphs","Probability and uncertainty","Reading a news chart: spotting misleading statistics","Patterns, variables, and equations","Motion, forces, and energy","Waves, light, and sound","Electricity and magnetism","Atoms and the periodic table","Chemical reactions in daily life","Cells and living systems","DNA, genes, and inheritance","Natural selection and evolution","Human body systems overview","Ecosystems and food webs","Earth’s structure and plate tectonics","Weather vs climate","Solar system and planetary science","Stars, galaxies, and cosmic scale","Climate evidence and energy balance","Reading a scientific paper without fear"],"books":[["Astrophysics for People in a Hurry","Neil deGrasse Tyson","Short introduction to cosmic ideas."],["Biology 2e","OpenStax","Free online textbook for biology foundations."],["Seven Brief Lessons on Physics","Carlo Rovelli","Short, lyrical tour of modern physics."]],"resources":[["Khan Academy","https://www.khanacademy.org/"],["OpenStax","https://openstax.org/"],["NASA","https://www.nasa.gov/"],["PhET Simulations","https://phet.colorado.edu/"],["Our World in Data","https://ourworldindata.org/"]],"project":"Create a scientific explainer with a diagram or graph, reliable sources, and a section on uncertainty.","facts":["Galileo pointed a telescope at Jupiter in 1610 and saw four moons circling it, which didn’t fit the idea that everything orbits Earth.","The metre was first defined as one ten-millionth of the distance from the North Pole to the equator. Today it’s defined using the speed of light.","A graph whose y-axis doesn’t start at zero can make a tiny change look huge. Check the axis labels first.","In a room of 23 people, there’s about a 50% chance two of them share a birthday.","Percent change can mislead. Going from 1 case to 2 is a 100% increase, but it’s still tiny. Always ask what the starting number was.","The equals sign was invented by the Welsh mathematician Robert Recorde in 1557, because he was tired of writing “is equal to”.","In a vacuum, a feather and a hammer fall at the same rate. Astronaut David Scott showed this on the Moon in 1971.","Light takes about 8 minutes and 20 seconds to travel from the Sun to Earth.","Lightning can heat the air around it to about 30,000 °C, much hotter than the surface of the Sun.","Dmitri Mendeleev’s 1869 periodic table left gaps for elements nobody had found yet, and later discoveries fit his predictions.","Baking soda and vinegar fizz because they make carbon dioxide gas, the same gas yeast makes to puff up bread.","Robert Hooke coined the word “cell” in 1665 while looking at cork, because the tiny boxes reminded him of monks’ rooms.","If you stretched out the DNA from one human cell, it would be about two metres long.","Darwin waited about 20 years to publish On the Origin of Species in 1859, and Alfred Russel Wallace had reached a similar idea independently.","Your heart beats roughly 100,000 times a day, and your stomach lining replaces itself every few days.","After wolves were reintroduced to Yellowstone in 1995, changes rippled through the food web, and scientists still debate how far they went.","The Himalaya are still rising by a few millimetres a year as India pushes into Asia.","Weather is what you wear today, and climate is what’s in your wardrobe: the long-term pattern, usually averaged over 30 years.","A day on Venus is longer than its year. Venus spins once in about 243 Earth days but orbits the Sun in about 225.","Proxima Centauri, the Sun’s nearest neighbour star, is over four light years away, so we see it as it was more than four years ago.","Air bubbles trapped in Antarctic ice cores let scientists measure the ancient atmosphere, going back hundreds of thousands of years.","A good way to start a scientific paper: read the abstract and the figures first, then the methods. Scientists read papers out of order too."]},{"subject":"Art, Architecture, Design and Cinema","focus":"Learn to see how humans make meaning visually.","weeks":["How to look at art","Architecture and design","Photography and visual communication","Cinema and storytelling"],"topics":["Line, shape, color, and texture","Composition and visual hierarchy","Symbolism and context","Art across world traditions","Nepali art: paubha, Newar craft, and Kathmandu temples","How buildings respond to climate and place","Ancient and sacred architecture","Bauhaus and design principles","Public space and accessibility","Framing, angle, and light","Photojournalism and ethics","Typography and layout","Color theory and mood","Advertising and persuasion","Shots, editing, and continuity","Sound, music, and silence","Genre and film history","Documentary and point of view","Adaptation and representation"],"books":[["Ways of Seeing","John Berger","Influential guide to images, culture, and power."],["The Story of Art","E. H. Gombrich","Selected chapters; broaden beyond its traditional canon."],["Film Art: An Introduction","Bordwell, Thompson, and Smith","Optional library reference for film language."]],"resources":[["Google Arts & Culture","https://artsandculture.google.com/"],["Smarthistory","https://smarthistory.org/"],["The Met Collection","https://www.metmuseum.org/art/collection"],["National Film Board of Canada","https://www.nfb.ca/"]],"project":"Produce a visual essay analyzing an artwork, building, design object, or film sequence.","facts":["A painted pig on a cave wall in Sulawesi, Indonesia, has been dated to more than 45,000 years ago.","The “rule of thirds” divides a picture into a 3 by 3 grid. Placing the important parts along the lines tends to feel balanced.","In many European still-life paintings, a skull or an hourglass quietly reminds the viewer that time passes. They’re called memento mori.","Japanese woodblock prints like Hokusai’s Great Wave were cheap and mass-produced, and later inspired many European painters.","Paubha is a Newar painting tradition of Nepal, usually of deities, painted on cloth with mineral pigments in strict proportions.","Traditional Newar houses have carved wooden lattice windows that let in air and light while keeping some privacy.","Boudhanath stupa in Kathmandu is one of the largest spherical stupas in the world.","The Bauhaus school ran only from 1919 to 1933, but its ideas about simple shapes and useful design still shape furniture and typefaces today.","Curb cuts, the little ramps on pavements, were fought for by wheelchair users, and they also help strollers, bikes, and suitcases.","Photographers call the hour after sunrise and before sunset the “golden hour”, because the light is soft and warm.","A photo can be cropped or captioned to change its meaning. Ethical photojournalists don’t stage or alter what happened.","Serif fonts have small “feet” at the ends of letters. Sans-serif means “without serif”.","Warm colours like red and orange tend to feel energetic, and cool blues tend to feel calm, though meanings shift between cultures.","Many ads sell a feeling instead of a product. Notice what an ad makes you want before you notice what it sells.","Early filmmakers found that placing two shots together makes viewers invent a link between them. It’s called the Kuleshov effect.","Silent films were never really silent. They were usually shown with live music.","The Lumière brothers held one of the first public film screenings, in Paris in 1895.","Nanook of the North (1922) is an early documentary, and its director staged parts of it, which began a long argument about truth in documentaries.","A film adaptation always changes the book. Two hours can’t hold 400 pages, so choosing what to cut is the real art."]},{"subject":"Politics, Law and Justice","focus":"Understand power, rights, institutions, law, and public choices.","weeks":["Political ideas and systems","Constitutions and institutions","Law, rights, and justice","Global politics and civic life"],"topics":["What is power?","Democracy and representation","Authoritarianism and legitimacy","Political ideologies","Federalism and local government","Constitutional principles","Nepal’s road: from monarchy to federal republic","Legislatures and lawmaking","Courts and judicial review","Elections and representation","Civil vs criminal law basics","Due process and presumption of innocence","Human rights frameworks","Equality and discrimination","Punishment and rehabilitation","Diplomacy and international organizations","Conflict, peace, and negotiation","Media and political persuasion","Public policy and evidence"],"books":[["The Politics Book","DK","Visual introduction; use it as a map, not a final authority."],["Constitution of Nepal","Government of Nepal","Read the official text and note institutions and rights."],["Justice: What’s the Right Thing to Do?","Michael J. Sandel","Optional library reading and lecture companion."]],"resources":[["Nepal Law Commission","https://lawcommission.gov.np/"],["Election Commission Nepal","https://election.gov.np/"],["Parliament of Nepal","https://hr.parliament.gov.np/"],["International IDEA","https://www.idea.int/"]],"project":"Write a sourced policy brief with options, trade-offs, and a reasoned recommendation.","facts":["Max Weber defined a state as the group that claims a legitimate monopoly on the use of force in a territory.","“Democracy” comes from the Greek demos (people) and kratos (rule). In ancient Athens, many public jobs were filled by lottery.","Rulers rarely rely on force alone. Legitimacy, people believing a ruler has the right to rule, is a much cheaper way to stay in power.","“Left” and “right” in politics come from where people sat in France’s National Assembly in 1789.","Nepal’s 2015 constitution created seven provinces and 753 local governments.","Nepal’s current constitution was promulgated on 20 September 2015, which is 3 Ashwin 2072.","Nepal was declared a federal democratic republic on 28 May 2008, when the Constituent Assembly abolished the monarchy.","Nepal’s federal parliament has two houses: the House of Representatives and the National Assembly.","Judicial review means courts can check whether a law or an act of government follows the constitution. In the US it was established by Marbury v. Madison in 1803.","Different voting systems can turn the same votes into different results. Nepal’s House of Representatives mixes direct constituency seats with proportional ones.","In criminal law the state brings the case. In civil law one party sues another, often over money or a dispute.","The idea that a person is innocent until proven guilty goes back to Roman law and appears in the Universal Declaration of Human Rights.","The Universal Declaration of Human Rights was adopted by the UN General Assembly on 10 December 1948.","Equality and equity differ: equality gives everyone the same, equity gives people what they need to reach the same place.","Norway’s prison system focuses on rehabilitation and is often studied for its low reoffending rates.","The United Nations was founded in 1945, and Nepal joined in 1955.","Nepal’s Comprehensive Peace Accord was signed on 21 November 2006, ending a decade-long conflict.","“Propaganda” began as a neutral word. It comes from a Catholic Church committee set up in 1622 to spread the faith.","Before rolling out a policy widely, governments often run a pilot in a small area to see whether it works."]},{"subject":"Sociology, Anthropology and Human Cultures","focus":"See society from more than one point of view.","weeks":["Sociological lenses","Culture and anthropology","Power, change, and movement","Nepal and global connections"],"topics":["What is society?","Norms, values, and socialization","Institutions and social roles","Class, status, and inequality","Gender and identity as social topics","Culture, symbols, and meaning","Ethnography and field notes","Kinship and family diversity","Language and cultural context","Urbanization and community","Migration and diaspora","Identity and belonging","Collective action and social movements","Caste, class, and mobility in context","Language and regional identity in Nepal","Rural and urban life","Tourism and cultural representation","Globalization and cultural exchange"],"books":[["The Sociological Imagination","C. Wright Mills","Selected sections on personal experience and social structures."],["Introduction to Sociology 3e","OpenStax","Free online textbook."],["Anthropology: What Does It Mean to Be Human?","Lavenda and Schultz","Optional library introduction."]],"resources":[["OpenStax Sociology","https://openstax.org/details/books/introduction-sociology-3e"],["Society for Cultural Anthropology","https://culanth.org/"],["Smithsonian Natural History","https://naturalhistory.si.edu/"],["Our World in Data","https://ourworldindata.org/"]],"project":"Complete a small ethical social inquiry using published sources or a consent-based interview.","facts":["Sociologist C. Wright Mills said the “sociological imagination” links personal troubles to public issues.","Norms are mostly invisible until someone breaks one, like standing too close in a lift.","Families, schools, markets, and governments are institutions: patterns of behaviour that outlast any single person.","Max Weber argued that class, status, and power are different things, so someone can have prestige without much money.","Sociologists often separate sex from gender, treating gender as roles and expectations that societies build and that change over time.","A handshake, a namaste, a bow: gestures carry meaning only because a group agrees on them.","Bronisław Malinowski pioneered long-term fieldwork, living among the people of the Trobriand Islands around 1915 to 1918.","Some societies trace descent through the mother’s line, others through the father’s, and some through both. Family comes in many shapes.","Nepal has more than 120 languages, according to its recent censuses.","More than half of the world’s people have lived in cities since about 2007.","Remittances from Nepalis working abroad equal a large share of Nepal’s GDP, over a fifth in recent years.","People hold many identities at once: a student, a sister, a Newar, a Nepali, a reader. Which one feels strongest shifts with the situation.","The Jana Andolan of 1990 restored multiparty democracy in Nepal after mass protests.","Nepal’s 1963 Muluki Ain removed the legal basis for caste hierarchy, and a 2011 law made caste-based discrimination a punishable crime.","Nepali is the most widely spoken language in Nepal, but census data show many people speak others at home, like Maithili, Bhojpuri, and Tharu.","Ferdinand Tönnies contrasted close-knit “Gemeinschaft” communities with more impersonal “Gesellschaft” societies.","Tourism can bring income and also turn living traditions into performances. Sociologists ask who decides what is shown.","The momo is believed to have reached Nepal through Tibetan and Newar trading links, and now comes in countless local versions."]},{"subject":"Economics and Personal Finance","focus":"Understand money, markets, choices, and trade-offs.","weeks":["How economies work","Trade, government, and the world","Personal finance foundations","Risk, decisions, and future planning"],"topics":["Scarcity and opportunity cost","Supply, demand, and prices","Markets and competition","GDP and living standards","Inflation and unemployment","Comparative advantage and trade","Taxes and public goods","Central banks and monetary policy","Development and inequality","Nepal’s economy: remittances, hydropower, and trade","Build a fictional monthly budget","Saving and emergency funds","Bank accounts, interest, and fees","Debt and borrowing costs","Compound interest and time","Risk and diversification basics","Fraud, scams, and consumer protection","Behavioral biases in money decisions"],"books":[["The Undercover Economist","Tim Harford","Accessible introduction to economic reasoning."],["The Psychology of Money","Morgan Housel","Short essays on behavior and money."],["Principles of Economics","OpenStax","Free online economics textbook."]],"resources":[["OpenStax Economics","https://openstax.org/subjects/business"],["Nepal Rastra Bank","https://www.nrb.org.np/"],["World Bank Data","https://data.worldbank.org/"],["Khan Academy Economics","https://www.khanacademy.org/economics-finance-domain"]],"project":"Build a personal-finance handbook using a fictional budget, savings plan, and risk checklist.","facts":["Opportunity cost is what you give up: an hour spent scrolling is an hour not spent reading.","When prices rise, buyers usually buy less and sellers want to sell more. The price where they meet is called the equilibrium.","Adam Smith’s “invisible hand” appears in The Wealth of Nations (1776), but only once in the whole book.","GDP counts the value of goods and services made in a country in a year, but it doesn’t count unpaid work like caring for family.","In Germany in 1923, hyperinflation got so bad that prices were doubling every few days.","David Ricardo showed in 1817 that countries can both gain from trade even if one is better at making everything.","Public goods, like street lighting, can be used by everyone at once and are hard to charge for, which is why taxes often pay for them.","Nepal Rastra Bank was set up in 1956 as Nepal’s central bank.","Economists measure inequality with the Gini coefficient, from 0 (everyone equal) to 1 (one person has everything).","Nepal’s rivers fall steeply from the Himalaya, which gives it huge hydropower potential, and it now sells surplus electricity to India.","The 50/30/20 rule splits income into needs, wants, and savings. It’s a starting point, not a law.","Many advisers suggest an emergency fund covering three to six months of living costs.","The word “bank” probably comes from the Italian “banco”, the bench money-changers worked at.","Interest is the price of borrowing, and a small difference in rate can mean a big difference in what you repay.","The rule of 72: divide 72 by the interest rate to estimate how many years it takes money to double.","“Don’t put all your eggs in one basket” is diversification in a sentence.","Scams often create urgency or secrecy: “act now” and “tell no one”. Pausing for an hour is a strong defence.","Loss aversion: losing 1,000 rupees feels worse than gaining 1,000 feels good. Kahneman and Tversky studied this."]},{"subject":"Technology, AI and the Digital World","focus":"Understand the tools shaping modern life and use them responsibly.","weeks":["How computers and the internet work","Programming and data","AI and machine learning","Digital life and responsibility"],"topics":["Bits, bytes, and binary ideas","Hardware, operating systems, and files","Networks and the internet","Websites, browsers, and servers","Data, databases, and APIs","Algorithms and step-by-step instructions","Variables, conditions, and loops","Functions and debugging","Data tables and visualization","AI vs automation vs machine learning","Training data and labels","Classification and prediction","Neural networks at a high level","Generative AI and its limitations","Using AI to learn: checking what it tells you","Passwords, authentication, and phishing","Privacy and data trails","Algorithmic bias and fairness","AI in education and work"],"books":[["Hello World","Hannah Fry","Accessible introduction to algorithmic decisions."],["Think Python","Allen B. Downey","Free online beginner programming book."],["Automate the Boring Stuff with Python","Al Sweigart","Free online; first projects that actually do something."]],"resources":[["Elements of AI","https://www.elementsofai.com/"],["Think Python","https://greenteapress.com/wp/think-python-3rd-edition/"],["Google Teachable Machine","https://teachablemachine.withgoogle.com/"],["CS50","https://cs50.harvard.edu/x/"],["CISA","https://www.cisa.gov/"]],"project":"Create a responsible-AI explainer or tiny demo, including limitations, privacy, and bias.","facts":["A bit is a 1 or a 0. Eight bits make a byte, and one byte can store a single letter like “A”.","In 1947, operators found a moth stuck in Harvard’s Mark II computer and taped it into the logbook, a famous early “bug”.","Data on the internet is cut into small packets, which can take different routes and get reassembled at the end.","Tim Berners-Lee invented the World Wide Web in 1989 while working at CERN.","An API is like a restaurant menu: it lists what you can ask for without showing you the kitchen.","The word “algorithm” comes from al-Khwarizmi, a Persian mathematician of the 9th century.","Ada Lovelace wrote what’s often called the first computer program, in the 1840s.","Rubber duck debugging: explain your code line by line to a rubber duck and you often find the bug yourself.","Florence Nightingale used a “rose” diagram to show that more soldiers died of disease than of wounds in the Crimean War.","The term “artificial intelligence” was coined for a summer workshop at Dartmouth in 1956.","A model learns from examples: show it enough labelled cat photos and it learns what cats tend to look like. Bad or skewed labels teach bad lessons.","Your email spam filter is a classifier: it sorts messages into spam or not spam based on patterns.","Artificial neural networks are only very loosely inspired by the brain. In practice they’re layers of numbers adjusted during training.","Language models can write confident sentences that are wrong, which people call hallucinations. Always check important claims.","A good habit: ask an AI for its source, then open the source yourself. If you can’t find it, treat the claim as unconfirmed.","A long passphrase of several random words is usually stronger and easier to remember than a short, complicated password.","Photos from your phone often carry hidden data, like when and where they were taken. It’s called metadata.","If a system learns from past decisions that were unfair, it can repeat that unfairness at scale.","Calculators were once debated in classrooms, and schools later learned to teach with them. People are now working out the same for AI."]},{"subject":"Geography, World Cultures and Global Connections","focus":"Connect places, people, environments, and futures.","weeks":["Maps and physical geography","People and places","Global systems and shared challenges","Nepal, South Asia, and the future"],"topics":["Latitude, longitude, scale, and projections","Continents, oceans, and landforms","Climate zones and biomes","Rivers, mountains, and settlement","Natural hazards and risk","Earthquakes: Nepal in 2015 and living with risk","Population and demographic change","Cities, transport, and urban form","Food, climate, and cultural exchange","Energy systems and transitions","Biodiversity and conservation","Climate change and adaptation","Water, food, and resource access","Nepal’s physical regions and ecosystems","Himalayan glaciers, rivers, and water","South Asian connections","Heritage, tourism, and conservation","Development and inequality","Futures thinking and scenarios"],"books":[["Prisoners of Geography","Tim Marshall","Accessible geopolitical framing; geography is not destiny."],["The Sixth Extinction","Elizabeth Kolbert","Optional reporting on biodiversity loss."],["The World Factbook","CIA","Free reference data; cross-check and note dates."]],"resources":[["National Geographic Education","https://education.nationalgeographic.org/"],["CIA World Factbook","https://www.cia.gov/the-world-factbook/"],["Our World in Data","https://ourworldindata.org/"],["NASA Earth Observatory","https://earthobservatory.nasa.gov/"],["UN Data","https://data.un.org/"]],"project":"Create a multimedia atlas showing how geography, history, culture, economics, and environment connect.","facts":["The Mercator map makes Greenland look as large as Africa. Africa is about 14 times bigger.","The Pacific Ocean is larger than all of Earth’s land put together.","Within a couple of hundred kilometres, Nepal rises from the hot Terai plains to Mount Everest at 8,849 m.","Many early cities grew on rivers: the Nile, the Tigris and Euphrates, the Indus, and the Yellow River.","Risk depends on hazard, exposure, and vulnerability, so the same earthquake can do very different damage in different places.","Nepal’s earthquake on 25 April 2015 had a magnitude of 7.8 and affected a large part of the country.","The world’s population passed 8 billion in November 2022, according to the United Nations.","A city’s shape follows its transport: streets laid out for walking look very different from streets laid out for cars.","Chillies came to Asia from the Americas only about 500 years ago, after European voyages. Potatoes and tomatoes made the same trip.","Almost all of Nepal’s electricity comes from hydropower.","Nepal is home to the one-horned rhino, the Bengal tiger, and the red panda.","Adaptation means adjusting to changes already happening, like new crop varieties or flood early-warning systems.","Only about 3% of Earth’s water is fresh water, and most of that is frozen in glaciers and ice.","Nepal has three main ecological belts running east to west: the Terai, the Hills, and the Himal (mountains).","The Himalaya hold the largest store of ice outside the polar regions, which is why they’re sometimes called the “Third Pole”.","The Koshi, Gandaki, and Karnali rivers begin in Nepal’s mountains and flow on into India to join the Ganga.","Nepal has four World Heritage sites: the Kathmandu Valley, Lumbini, Chitwan National Park, and Sagarmatha National Park.","The UN’s Human Development Index combines health, education, and income, because wealth alone doesn’t capture wellbeing.","Futures thinkers use scenarios, not predictions: several plausible stories about tomorrow to test plans against."]}];

 if(kind==="notebook"){const c=$("copy");if(c)c.onclick=()=>{const t=nbText();
  const fb=()=>{$("cbox").innerHTML='<textarea class="copybox" id="cb" readonly></textarea>';$("cb").value=t;$("cb").select();$("cmsg").textContent="Press Ctrl or Cmd+C to copy."};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>{$("cmsg").textContent="Copied."},fb);else fb()}}
 else{$("tPip").onclick=()=>{me.pip=me.pip===false;saveMe();$("tPip").setAttribute("aria-pressed",me.pip);if(!me.pip)hidePip()};
  $("sn").oninput=e=>{me.name=e.target.value.trim();saveMe();renderTop()};
  $("sw").oninput=e=>{me.why=e.target.value.trim();saveMe();renderTop()};
  $("ss").oninput=e=>{me.start=e.target.value||"15:00";saveMe();renderPage()};
  $("wipe").onclick=()=>{if(!S.wipe){S.wipe=true;$("wipe").textContent="Yes, clear everything";$("nowipe").hidden=false;return}
   S.done={};me.notes={};me.proj={};saveDone();saveMe();closeSheet();renderAll()};
  $("nowipe").onclick=()=>{S.wipe=false;$("wipe").textContent="Clear everything";$("nowipe").hidden=true}}}
function closeSheet(){S.sheet=null;$("sheet").hidden=true;if(S.opener&&S.opener.focus)S.opener.focus()}

/* wiring */
$("year").onclick=e=>{const b=e.target.closest("[data-m]");if(b)go(+b.dataset.m,1)};
$("days").onclick=e=>{const b=e.target.closest("[data-d]");if(!b)return;S.d=+b.dataset.d;renderCal();renderPage();showPip(factFor(S.m,S.d));if(innerWidth<1000)$("page").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"})};
$("bToday").onclick=()=>in27?go(now.getMonth(),now.getDate()):go(0,1);
$("bNote").onclick=()=>openSheet("notebook");
$("bSet").onclick=()=>openSheet("settings");
$("scrim").onclick=closeSheet;
$("find").addEventListener("input",e=>{const q=e.target.value.toLowerCase().trim();if(q.length<2)return;
 for(let m=0;m<12;m++)for(let d=1;d<=dim(m);d++){const t=topicFor(m,d);if(!t.rest&&t.topic.toLowerCase().includes(q)){go(m,d);return}}});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&S.sheet){closeSheet();return}
 if(e.key==="Escape"&&!$("pip").hidden){hidePip();return}
 if(S.sheet||/INPUT|TEXTAREA/.test(e.target.tagName))return;
 if(e.key==="ArrowRight")go((S.m+1)%12,1);if(e.key==="ArrowLeft")go((S.m+11)%12,1)});
$("prevM").onclick=()=>go((S.m+11)%12,1);$("nextM").onclick=()=>go((S.m+1)%12,1);
$("pipOwl").innerHTML=OWL;
$("pipX").onclick=hidePip;
$("pipMore").onclick=()=>showPip({...randomFact(S.m),title:"Another one from Pip",force:true});
$("bFun").onclick=()=>showPip({...randomFact(0,true),title:"Surprise from Pip",force:true});
document.querySelector(".foot").textContent=FOOT[Math.floor(Math.random()*FOOT.length)];
renderLegend();renderAll();
setTimeout(()=>showPip(factFor(S.m,S.d)),700);
</script>

</body></html>
